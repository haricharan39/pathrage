# Nav2 parameter STUB -- replaced by a full configuration in Phase 4.
# Global planner: NavFn with A*. Local controller: MPPI (teb_local_planner is not
# available as a Humble apt package). Costmaps take the Tier 1/2 obstacle points
# through Nav2's built-in ObstacleLayer (no custom plugin).

planner_server:
  ros__parameters:
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"   # swap for a D* Lite plugin later
      use_astar: true

controller_server:
  ros__parameters:
    controller_plugins: ["FollowPath"]
    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      # TODO (Phase 4): motion_model DiffDrive, velocity limits, footprint, critics

local_costmap:
  local_costmap:
    ros__parameters:
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        # TODO (Phase 4): observation source = /perception/obstacle_points (PointCloud2)
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.75   # TODO: tune against real obstacle sizes
